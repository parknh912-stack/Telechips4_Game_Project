<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE SURVIVOR — API Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Green & Cyan Theme Colors */
  --bg-deep:       #050806;
  --bg-sidebar:    #0a120e;
  --bg-panel:      #0d1a15;
  --bg-panel-hover:#12261e;
  --border-color:  #163329;
  --accent-cyan:   #18ffff;
  --accent-green:  #00e676;
  --text-main:     #d4f0e5;
  --text-muted:    #5a8071;
  --code-bg:       #030806;
  
  --glow-cyan:     rgba(24, 255, 255, 0.2);
  --glow-green:    rgba(0, 230, 118, 0.2);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg-deep);
  color: var(--text-main);
  height: 100vh;
  overflow: hidden;
  display: flex;
  background-image: 
    radial-gradient(circle at 80% 20%, var(--glow-green) 0%, transparent 40%),
    radial-gradient(circle at 20% 80%, var(--glow-cyan) 0%, transparent 40%);
  background-attachment: fixed;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: 
    linear-gradient(var(--border-color) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
  background-size: 50px 50px;
  opacity: 0.15;
  pointer-events: none;
  z-index: -1;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #234d3d; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-green); }

/* =========================================
   KEYWORD HIGHLIGHTING (본문 텍스트용)
   ========================================= */
.kw-ship   { color: #69f0ae; font-weight: 700; text-shadow: 0 0 5px rgba(105,240,174,0.3); }
.kw-player { color: #18ffff; font-weight: 700; text-shadow: 0 0 5px rgba(24,255,255,0.3); }
.kw-enemy  { color: #ff5252; font-weight: 700; text-shadow: 0 0 5px rgba(255,82,82,0.3); }

/* =========================================
   FUNCTION NAME COLOR HIGHLIGHTING (함수명 전용)
   ========================================= */
.color-ship  { color: #80d8ff !important; text-shadow: 0 0 8px rgba(128, 216, 255, 0.4); }
.color-shot  { color: #ffffff !important; text-shadow: 0 0 8px rgba(255, 255, 255, 0.4); }
.color-alien { color: #ff8a80 !important; text-shadow: 0 0 8px rgba(255, 138, 128, 0.4); }

/* =========================================
   LEFT SIDEBAR (Navigation)
   ========================================= */
aside {
  width: 320px;
  flex-shrink: 0;
  background: rgba(10, 18, 14, 0.95);
  backdrop-filter: blur(10px);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  z-index: 50;
  box-shadow: 5px 0 30px rgba(0,0,0,0.5);
  transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
  overflow-x: hidden;
  white-space: nowrap;
}

body.sidebar-closed aside { width: 76px; }

.sidebar-top {
  display: flex; align-items: center; padding: 24px 18px; gap: 16px;
  border-bottom: 1px solid var(--border-color);
}

.hamburger-btn {
  background: transparent; border: none; color: var(--text-muted);
  width: 40px; height: 40px; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s;
}
.hamburger-btn:hover { background: rgba(255, 255, 255, 0.05); color: var(--accent-cyan); }
.hamburger-btn svg { width: 24px; height: 24px; fill: currentColor; }

.brand-info { cursor: pointer; opacity: 1; transition: opacity 0.2s, transform 0.2s; }
.brand-info:hover { transform: scale(1.02); }
body.sidebar-closed .brand-info { opacity: 0; pointer-events: none; }

.brand-title {
  font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900;
  color: #fff; text-transform: uppercase; text-shadow: 0 0 10px var(--glow-cyan);
}
.brand-subtitle {
  font-family: 'Fira Code', monospace; color: var(--accent-green);
  font-size: 11px; letter-spacing: 0.1em; margin-top: 5px;
}

.search-wrap {
  margin: 20px 18px 10px; position: relative; height: 40px;
  display: flex; align-items: center; border-radius: 6px; transition: background 0.2s;
}
body.sidebar-closed .search-wrap { cursor: pointer; }
body.sidebar-closed .search-wrap:hover { background: rgba(255, 255, 255, 0.05); }

.search-icon {
  position: absolute; left: 0; width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 18px; z-index: 2; pointer-events: none; transition: color 0.2s;
}
body.sidebar-closed .search-icon { color: var(--text-main); }
body.sidebar-closed .search-wrap:hover .search-icon { color: var(--accent-cyan); }

.search-wrap input {
  width: 100%; height: 100%; background: var(--bg-panel); border: 1px solid var(--border-color);
  padding: 0 14px 0 40px; border-radius: 6px; color: #fff;
  font-family: 'Fira Code', monospace; font-size: 13px; outline: none; transition: opacity 0.3s, border-color 0.2s, box-shadow 0.2s;
}
.search-wrap input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px var(--glow-cyan); }
body.sidebar-closed .search-wrap input { opacity: 0; pointer-events: none; }

.nav-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 0 30px; }
.nav-category { margin-bottom: 15px; }

.nav-category-title { display: flex; align-items: center; padding: 10px 18px; gap: 16px; cursor: pointer; transition: background 0.2s; }
.nav-category-title:hover { background: rgba(255, 255, 255, 0.02); }

.cat-icon {
  font-size: 22px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; transition: border-color 0.3s, box-shadow 0.3s;
}
body.sidebar-closed .nav-category-title:hover .cat-icon { border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(24, 255, 255, 0.2); }

.cat-text { font-family: 'Orbitron', sans-serif; font-size: 12px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; transition: opacity 0.2s; }
body.sidebar-closed .cat-text { opacity: 0; }

.nav-item {
  display: flex; align-items: center; padding-left: 74px; height: 36px;
  color: #8cbaaa; font-family: 'Fira Code', monospace; font-size: 13px; cursor: pointer; transition: all 0.2s; position: relative;
}
body.sidebar-closed .nav-item { opacity: 0; height: 0; padding: 0; pointer-events: none; }

.nav-item::before {
  content: ''; position: absolute; left: 56px; top: 50%; transform: translateY(-50%); width: 4px; height: 4px;
  background: var(--text-muted); border-radius: 50%; transition: all 0.2s;
}
.nav-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
.nav-item:hover::before { background: var(--accent-green); box-shadow: 0 0 5px var(--accent-green); }
.nav-item.active { background: rgba(24, 255, 255, 0.1); color: var(--accent-cyan) !important; font-weight: 600; text-shadow: 0 0 8px var(--accent-cyan); }
.nav-item.active::before { background: var(--accent-cyan); box-shadow: 0 0 8px var(--accent-cyan); }


/* =========================================
   RIGHT MAIN CONTENT
   ========================================= */
main { flex: 1; overflow-y: auto; position: relative; }

.btn-back {
  position: absolute; top: -40px; left: 0; background: transparent; border: none;
  color: var(--text-muted); font-family: 'Fira Code', monospace; font-size: 13px;
  cursor: pointer; display: flex; align-items: center; gap: 5px; transition: color 0.2s;
}
.btn-back:hover { color: var(--accent-cyan); }

/* ── 1. HOME VIEW ── */
#homeView { padding: 60px 40px 100px; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; animation: fadeIn 0.4s ease forwards; }

header.hero { text-align: center; margin-bottom: 60px; }
.title-glitch { font-family: 'Orbitron', sans-serif; font-size: clamp(50px, 6vw, 90px); font-weight: 900; color: #fff; letter-spacing: 0.05em; text-shadow: 0 0 20px var(--glow-green), 0 0 40px var(--glow-cyan); margin-bottom: 15px; }
.hero-subtitle { font-family: 'Fira Code', monospace; color: var(--accent-green); font-size: 16px; letter-spacing: 0.15em; }

.module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
.module-card {
  background: rgba(13, 26, 21, 0.8); backdrop-filter: blur(5px); border: 1px solid var(--border-color); border-radius: 12px;
  padding: 30px; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; overflow: hidden;
}
.module-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green)); opacity: 0; transition: opacity 0.3s; }
.module-card:hover { transform: translateY(-5px); border-color: rgba(0, 230, 118, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.6); background: var(--bg-panel-hover); }
.module-card:hover::before { opacity: 1; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.card-icon { font-size: 36px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.1)); }
.card-count { font-family: 'Fira Code', monospace; font-size: 12px; color: var(--accent-cyan); background: rgba(24, 255, 255, 0.1); padding: 4px 10px; border-radius: 20px; }
.card-title { font-family: 'Orbitron', sans-serif; font-size: 20px; color: #fff; margin-bottom: 10px; }
.card-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

/* ── 2. MODULE VIEW ── */
#moduleView { padding: 60px 50px 100px; max-width: 1000px; margin: 0 auto; display: none; animation: fadeIn 0.4s ease forwards; }
.mod-header-wrap { margin-bottom: 40px; position: relative; }
.mod-title { font-family: 'Orbitron', sans-serif; font-size: 36px; color: var(--accent-cyan); text-shadow: 0 0 20px rgba(24, 255, 255, 0.3); margin-bottom: 15px; display: flex; align-items: center; gap: 15px; }
.mod-desc { font-size: 16px; color: #c9d1d9; line-height: 1.6; }

.fn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; }
.fn-card {
  background: rgba(13, 26, 21, 0.6); border: 1px solid var(--border-color); border-radius: 10px;
  padding: 24px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column;
}
.fn-card:hover { background: var(--bg-panel-hover); border-color: var(--accent-green); transform: translateY(-3px); box-shadow: 0 5px 20px rgba(0, 230, 118, 0.15); }
.fn-card-name { font-family: 'Fira Code', monospace; font-size: 18px; color: #fff; margin-bottom: 10px; transition: color 0.2s; }
.fn-card-name::before { content: 'ƒ'; color: var(--accent-green); margin-right: 8px; font-style: italic; }
.fn-card-brief { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

/* ── 3. DETAIL VIEW ── */
#detailView { padding: 60px 50px 100px; max-width: 1000px; margin: 0 auto; display: none; animation: fadeIn 0.4s ease forwards; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.doc-header { margin-bottom: 40px; position: relative; }
.doc-category-badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px;
  background: rgba(0, 230, 118, 0.15); border: 1px solid rgba(0, 230, 118, 0.4); color: #69f0ae;
  font-family: 'Orbitron', sans-serif; font-size: 12px; border-radius: 20px; margin-bottom: 15px;
}
.doc-title { font-family: 'Fira Code', monospace; font-size: 40px; color: var(--accent-cyan); text-shadow: 0 0 20px rgba(24, 255, 255, 0.3); margin-bottom: 15px; word-break: break-all; }
.doc-brief { font-size: 18px; color: #fff; font-weight: 400; line-height: 1.6; }

.doc-section {
  margin-bottom: 35px; background: rgba(13, 26, 21, 0.6); border: 1px solid var(--border-color);
  border-radius: 12px; padding: 30px; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.section-label {
  font-family: 'Orbitron', sans-serif; font-size: 15px; color: var(--text-muted); letter-spacing: 2px;
  text-transform: uppercase; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
}
.section-label::before { content: ''; display: block; width: 6px; height: 16px; background: var(--accent-green); border-radius: 3px; }

.doc-desc { font-size: 16px; line-height: 1.8; color: #c9d1d9; }

.code-block {
  background: var(--code-bg); border: 1px solid #163329; padding: 20px; border-radius: 8px;
  font-family: 'Fira Code', monospace; font-size: 15px; color: #a5d6ff; overflow-x: auto; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); white-space: pre;
}
.code-type { color: #ff7b72; }
.code-func { color: #79c0ff; font-weight: 600; }
.code-paren { color: #d2a8ff; }

.param-table { width: 100%; border-collapse: collapse; }
.param-table th { text-align: left; padding: 12px 15px; font-family: 'Orbitron', sans-serif; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid #163329; }
.param-table td { padding: 16px 15px; border-bottom: 1px solid rgba(22, 51, 41, 0.5); vertical-align: top; }
.param-table tr:last-child td { border-bottom: none; }
.p-name { color: var(--accent-cyan); font-family: 'Fira Code', monospace; font-size: 14px; }
.p-type { color: #69f0ae; font-family: 'Fira Code', monospace; font-size: 13px; background: rgba(0, 230, 118, 0.1); padding: 3px 8px; border-radius: 4px; display: inline-block; margin-top: 4px; }
.p-desc { font-size: 15px; line-height: 1.6; color: var(--text-main); margin-top: 5px;}

.return-value {
  display: inline-block; font-family: 'Fira Code', monospace; font-size: 16px; color: #fff;
  background: rgba(24, 255, 255, 0.1); border-left: 4px solid var(--accent-cyan); padding: 12px 20px; border-radius: 0 6px 6px 0;
}

/* ── PREV / NEXT NAVIGATION BUTTONS ── */
.doc-nav { display: flex; justify-content: space-between; margin-top: 50px; padding-top: 30px; border-top: 1px dashed var(--border-color); }
.nav-fn-btn {
  background: rgba(13, 26, 21, 0.6); border: 1px solid var(--border-color); padding: 15px 25px; border-radius: 8px;
  cursor: pointer; display: flex; align-items: center; gap: 15px; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); width: 48%; text-decoration: none;
}
.nav-fn-btn:hover { background: var(--bg-panel-hover); border-color: var(--accent-cyan); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(24, 255, 255, 0.15); }
.nav-fn-btn.hidden { visibility: hidden; }
.nav-arrow { font-size: 24px; color: var(--accent-green); transition: transform 0.3s, color 0.3s; }
.nav-fn-btn:hover .nav-arrow { color: var(--accent-cyan); }
.nav-fn-btn.prev:hover .nav-arrow { transform: translateX(-5px); }
.nav-fn-btn.next:hover .nav-arrow { transform: translateX(5px); }

.nav-fn-texts { display: flex; flex-direction: column; flex: 1; }
.nav-fn-label { font-family: 'Orbitron', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; color: var(--text-muted); }
.nav-fn-name { font-family: 'Fira Code', monospace; font-size: 15px; color: var(--text-main); transition: color 0.2s; }
.nav-fn-btn:hover .nav-fn-name { color: var(--accent-cyan) !important; text-shadow: none; }
.nav-fn-btn.prev .nav-fn-texts { text-align: right; }
.nav-fn-btn.next .nav-fn-texts { text-align: left; }
</style>
</head>
<body>

<aside>
  <div class="sidebar-top">
    <button class="hamburger-btn" id="sidebarToggle" title="Toggle Sidebar">
      <svg viewBox="0 0 24 24">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>
    <div class="brand-info" onclick="showHome()">
      <div class="brand-title">SURVIVOR</div>
      <div class="brand-subtitle">API Reference</div>
    </div>
  </div>
  
  <div class="search-wrap" id="searchWrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search functions..." autocomplete="off">
  </div>

  <div class="nav-list" id="navList"></div>
</aside>

<main id="mainArea">
  
  <div id="homeView">
    <header class="hero">
      <div class="title-glitch">SPACE SURVIVOR</div>
      <div class="hero-subtitle">Telechips4_Game_Project · C API Reference</div>
    </header>
    <div class="module-grid" id="moduleGrid"></div>
  </div>

  <div id="moduleView">
    <div class="mod-header-wrap">
      <button class="btn-back" onclick="showHome()">← Back to Home</button>
      <div class="mod-title" id="modTitle">Module Name</div>
      <div class="mod-desc" id="modDesc">모듈 설명</div>
    </div>
    <div class="fn-grid" id="modFnGrid"></div>
  </div>

  <div id="detailView">
    <div class="doc-header">
      <button class="btn-back" onclick="goBackToModule()">← Back to Module</button>
      <div class="doc-category-badge" id="docCategory">Module Name</div>
      <div class="doc-title" id="docTitle">function_name()</div>
      <div class="doc-brief" id="docBrief" class="content-text">요약 설명</div>
    </div>

    <div class="doc-section">
      <div class="section-label">Signature</div>
      <div class="code-block" id="docSignature"></div>
    </div>

    <div class="doc-section">
      <div class="section-label">Description</div>
      <div class="doc-desc content-text" id="docDesc">상세 설명</div>
    </div>

    <div class="doc-section" id="paramSection">
      <div class="section-label">Parameters</div>
      <table class="param-table">
        <thead><tr><th style="width: 30%">Argument</th><th>Description</th></tr></thead>
        <tbody id="docParams" class="content-text"></tbody>
      </table>
    </div>

    <div class="doc-section">
      <div class="section-label">Returns</div>
      <div class="return-value" id="docReturn">void</div>
    </div>
    
    <div class="doc-section" id="exampleSection">
      <div class="section-label">Example</div>
      <div class="code-block content-text" id="docExample"></div>
    </div>

    <div class="doc-nav">
      <div class="nav-fn-btn prev" id="btnPrevFn" onclick="goPrevFn()">
        <span class="nav-arrow">←</span>
        <div class="nav-fn-texts">
          <span class="nav-fn-label">Previous Function</span>
          <span class="nav-fn-name" id="prevFnName">prev_func()</span>
        </div>
      </div>
      <div class="nav-fn-btn next" id="btnNextFn" onclick="goNextFn()">
        <div class="nav-fn-texts">
          <span class="nav-fn-label">Next Function</span>
          <span class="nav-fn-name" id="nextFnName">next_func()</span>
        </div>
        <span class="nav-arrow">→</span>
      </div>
    </div>

  </div>
</main>

<script>
// ─────────────────────────────────────────────
//  FUNCTION NAME COLOR HELPER
// ─────────────────────────────────────────────
function getFnColorClass(name) {
  const lower = name.toLowerCase();
  if (lower.includes('ship')) return 'color-ship';
  if (lower.includes('shot')) return 'color-shot';
  if (lower.includes('alien') || lower.includes('boss') || lower.includes('enemy')) return 'color-alien';
  return '';
}

// ─────────────────────────────────────────────
//  SPACE SURVIVOR API DATA
// ─────────────────────────────────────────────
const API_DATA = [
  {
    id: 'general',
    icon: '⚙️',
    title: 'General',
    desc: '초기화 검증, 난수 생성, AABB 충돌 감지 등 게임 전반에서 사용되는 범용 유틸리티 함수 모음입니다.',
    functions: [
      {
        name: 'must_init',
        sig: 'void must_init(bool test, const char* description)',
        brief: '초기화 실패 시 프로그램 종료',
        desc: 'Allegro 라이브러리 또는 리소스의 초기화 결과를 검사합니다. test가 false이면 오류 메시지를 출력하고 프로그램이 즉시 종료됩니다.',
        params: [
          { name: 'test', type: 'bool', desc: '초기화 성공 여부. true이면 정상 반환.' },
          { name: 'description', type: 'const char*', desc: '실패 시 출력할 문자열.' }
        ],
        ret: 'void',
        example: `<span class="code-type">ALLEGRO_DISPLAY</span>* disp = <span class="code-fn">al_create_display</span>(<span class="code-num">1200</span>, <span class="code-num">900</span>);
<span class="code-fn">must_init</span>(disp, <span class="code-str">"display"</span>);`
      },
      {
        name: 'between',
        sig: 'int between(int lo, int hi)',
        brief: '정수 범위 난수 반환',
        desc: '[lo, hi) 범위의 정수 난수를 반환합니다.',
        params: [
          { name: 'lo', type: 'int', desc: '하한 (포함).' },
          { name: 'hi', type: 'int', desc: '상한 (미포함).' }
        ],
        ret: 'int',
        example: `<span class="code-kw">int</span> rand_val = <span class="code-fn">between</span>(<span class="code-num">0</span>, <span class="code-num">100</span>);`
      },
      {
        name: 'between_f',
        sig: 'float between_f(float lo, float hi)',

// ─────────────────────────────────────────────
//  KEYWORD HIGHLIGHTING (DOM WALKER)
// ─────────────────────────────────────────────
function applyKeywordColors(element) {
  const walk = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
  let node;
  const textNodes = [];
  while ((node = walk.nextNode())) textNodes.push(node);
  
  textNodes.forEach(n => {
    let text = n.nodeValue;
    if (/\b(ship|player|enemy|alien|aliens)\b/i.test(text)) {
      let fragment = document.createDocumentFragment();
      let tempDiv = document.createElement('div');
      
      tempDiv.innerHTML = text
        .replace(/\b(ship)\b/gi, '<span class="kw-ship">$&</span>')
        .replace(/\b(player)\b/gi, '<span class="kw-player">$&</span>')
        .replace(/\b(enemy|alien|aliens)\b/gi, '<span class="kw-enemy">$&</span>');
        
      while (tempDiv.firstChild) {
        fragment.appendChild(tempDiv.firstChild);
      }
      n.parentNode.replaceChild(fragment, n);
    }
  });
}

// ─────────────────────────────────────────────

// ─────────────────────────────────────────────
function renderSidebar(filterText = '') {
  navList.innerHTML = '';
  
  API_DATA.forEach(cat => {
    const filteredFns = cat.functions.filter(fn => 
      fn.name.toLowerCase().includes(filterText) || 
      fn.brief.toLowerCase().includes(filterText)
    );

    if (filteredFns.length === 0) return;

    const catDiv = document.createElement('div');
    catDiv.className = 'nav-category';
    
    const catTitle = document.createElement('div');
    catTitle.className = 'nav-category-title';
    catTitle.innerHTML = `<div class="cat-icon">${cat.icon}</div> <div class="cat-text">${cat.title}</div>`;
    
    catTitle.addEventListener('click', () => {
      if (document.body.classList.contains('sidebar-closed')) {
        document.body.classList.remove('sidebar-closed');
      } else {
        showModuleView(cat); 
      }
    });
    
    catDiv.appendChild(catTitle);

    filteredFns.forEach(fn => {
      const item = document.createElement('div');
      item.className = `nav-item ${getFnColorClass(fn.name)}`; // 동적 색상 클래스 적용
      item.textContent = fn.name;
      
      item.addEventListener('click', () => {
        showDetailView(fn, cat.title, cat.icon, cat);
      });
      
      catDiv.appendChild(item);
    });

    navList.appendChild(catDiv);
  });
}

// 모듈 목록 화면 표시
function showModuleView(cat) {
  currentModule = cat; 
  
  homeView.style.display = 'none';
  detailView.style.display = 'none';
  
  moduleView.style.display = 'none';
  setTimeout(() => { moduleView.style.display = 'block'; }, 10);

  modTitle.innerHTML = `${cat.icon} ${cat.title}`;
  modDesc.textContent = cat.desc;

  modFnGrid.innerHTML = '';
  cat.functions.forEach(fn => {
    const card = document.createElement('div');
    card.className = 'fn-card';
    // fn-card-name에 동적 색상 클래스 부여
    card.innerHTML = `
      <div class="fn-card-name ${getFnColorClass(fn.name)}">${fn.name}</div>
      <div class="fn-card-brief">${fn.brief}</div>
    `;
    card.addEventListener('click', () => {
      showDetailView(fn, cat.title, cat.icon, cat);
    });
    modFnGrid.appendChild(card);
  });

  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
}

function goBackToModule() {
  if (currentModule) {
    showModuleView(currentModule);
  } else {
    showHome();
  }
}

// 상세 설명 화면 표시
function showDetailView(fn, catTitle, catIcon, parentCategory) {
  homeView.style.display = 'none';
  moduleView.style.display = 'none';
  
  if (parentCategory) {
    currentModule = parentCategory;
  } else {
    const found = flatFunctions.find(f => f.name === fn.name);
    if(found) currentModule = found.parentCategory;
  }
  
  detailView.style.display = 'none';
  setTimeout(() => { detailView.style.display = 'block'; }, 10);

  currentFnIndex = flatFunctions.findIndex(f => f.name === fn.name);
  updateNavigationButtons();

  document.querySelectorAll('.nav-item').forEach(el => {
    if (el.textContent === fn.name) el.classList.add('active');
    else el.classList.remove('active');
  });

  docCategory.innerHTML = `${catIcon} ${catTitle}`;
  docTitle.textContent = `${fn.name}()`;
  // 상단 타이틀 텍스트 색상 적용
  docTitle.className = `doc-title ${getFnColorClass(fn.name)}`;
  
  docBrief.textContent = fn.brief;
  docDesc.textContent = fn.desc;
  
  const parts = fn.sig.split(' ');
  const retType = parts[0];
  const rest = parts.slice(1).join(' ');
  const funcName = rest.split('(')[0];
  const paramsStr = rest.split('(')[1];
  
  docSignature.innerHTML = `
    <span class="code-type">${retType}</span> 
    <span class="code-func ${getFnColorClass(funcName)}">${funcName}</span><span class="code-paren">(</span>${paramsStr}
  `;

  if (fn.params && fn.params.length > 0) {
    paramSection.style.display = 'block';
    docParams.innerHTML = fn.params.map(p => `
      <tr>
        <td>
          <div class="p-name">${p.name}</div>
          <div class="p-type">${p.type}</div>
        </td>
        <td>
          <div class="p-desc">${p.desc}</div>
        </td>
      </tr>
    `).join('');
  } else {
    paramSection.style.display = 'none';
  }

  docReturn.textContent = fn.ret;
  
  if (fn.example) {
      exampleSection.style.display = 'block';
      docExample.innerHTML = fn.example;
  } else {
      exampleSection.style.display = 'none';
  }
  
  // 렌더링된 텍스트에 키워드(색상) 하이라이팅 적용
  document.querySelectorAll('.content-text').forEach(el => applyKeywordColors(el));
}

// ─────────────────────────────────────────────
//  PREV / NEXT NAVIGATION LOGIC
// ─────────────────────────────────────────────
function updateNavigationButtons() {
  if (currentFnIndex > 0) {
    btnPrevFn.classList.remove('hidden');
    const prevName = flatFunctions[currentFnIndex - 1].name;
    prevFnName.textContent = prevName + '()';
    prevFnName.className = `nav-fn-name ${getFnColorClass(prevName)}`; // 동적 색상 클래스 적용
  } else {
    btnPrevFn.classList.add('hidden');
  }

  if (currentFnIndex < flatFunctions.length - 1) {
    btnNextFn.classList.remove('hidden');
    const nextName = flatFunctions[currentFnIndex + 1].name;
    nextFnName.textContent = nextName + '()';
    nextFnName.className = `nav-fn-name ${getFnColorClass(nextName)}`; // 동적 색상 클래스 적용
  } else {
    btnNextFn.classList.add('hidden');
  }
}

function goPrevFn() {
  if (currentFnIndex > 0) {
    const prevFn = flatFunctions[currentFnIndex - 1];
    showDetailView(prevFn, prevFn.catTitle, prevFn.catIcon, prevFn.parentCategory);
  }
}

function goNextFn() {
  if (currentFnIndex < flatFunctions.length - 1) {
    const nextFn = flatFunctions[currentFnIndex + 1];
    showDetailView(nextFn, nextFn.catTitle, nextFn.catIcon, nextFn.parentCategory);
  }
}

// ─────────────────────────────────────────────
//  SEARCH LOGIC
// ─────────────────────────────────────────────
searchInput.addEventListener('input', (e) => {
  const query = e.target.value.trim().toLowerCase();
  renderSidebar(query);
});

// 시작 시 초기화
renderHomeCards();
renderSidebar();
</script>
